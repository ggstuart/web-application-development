<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100dvh;
            display: grid;
            font-family: system-ui;
        }
        #students {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .student {
            display: grid;
            grid-template-rows: auto 1fr;
            margin: 0;
            border: 2.5px solid #000;
            filter: brightness(0.8);
            img {
                object-fit: cover;
                width: 100%;
                aspect-ratio: 1.2;
            }
            figcaption {
                display: grid;
                place-content: center;
                background-color: #333;
                color: #eee;
            }
            &:hover {filter: none;}
        }


    </style>
</head>
<body>
    <section id="students">
        <figure class="student">
            <img src="https://placecats.com/120/100">
            <figcaption>P12345677</figcaption>
        </figure>

        <figure class="student">
            <img src="https://placecats.com/240/200">
            <figcaption>P12345678</figcaption>
        </figure>    

        <figure class="student">
            <img src="https://placecats.com/180/150">
            <figcaption>P12345679</figcaption>
        </figure>

        <figure class="student">
            <img src="https://placecats.com/300/250">
            <figcaption>P12345680</figcaption>
        </figure>
    </section>
</body>
</html>
