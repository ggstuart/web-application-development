baseURL = 'https://ggstuart.github.io/web-application-development'
theme = 'module'

[languages]
    [languages.en]
        locale = "en-gb"


[markup]
    [markup.highlight]
        _merge = "shallow"
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.renderHooks]
            [markup.goldmark.renderHooks.link]
                useEmbedded = "fallback"

[params]
    moduleName = 'Web application development'
    moduleCode = 'CTEC2712'
    customcss = ['colours.css', 'mdn.css']

[security]
    allowContent = ["text/html", "text/markdown"]

[outputs]
    _merge = "deep"
    home = ["html", "slideLayouts", "examples"]
[outputFormats]
    [outputFormats.slideLayouts]
        mediaType = "text/css"
        baseName = "css/slide-layouts"
        isPlainText = true
    [outputFormats.examples]
        mediaType = "text/plain"
        baseName = "examples"
