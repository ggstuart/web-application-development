
{{with .page}}
<article class="{{ delimit ( .Params.Classes | append "slide" ) " " }}" aria-labelledby="slide-{{$.slideNumber}}">
    <h2 id="slide-{{$.slideNumber}}">{{.Title}}</h2>
    <div class="content">
        {{ .Content }}
    </div>
    {{with $.slideNumber}}
        <small class="slide-number">{{.}}</small>
    {{end}}
</article>
{{end}}
